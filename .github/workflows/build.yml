name: Build static libraries

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release

      - name: Rename and Upload Linux static lib
        run: |
          cp build/lib/libGeruest.a build/lib/libGeruest-linux.a
        
      - name: Upload Linux static lib
        uses: softprops/action-gh-release@v2
        with:
          files: build/lib/libGeruest-linux.a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-mingw:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release

      - name: Rename and Upload Windows static lib (.a)
        shell: msys2 {0}
        run: |
          cp build/lib/libGeruest.a build/lib/libGeruest-windows.a
        
      - name: Upload Windows static lib (.a)
        uses: softprops/action-gh-release@v2
        with:
          files: build/lib/libGeruest-windows.a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure and Build (.lib)
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_GENERATOR_PLATFORM=x64 -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release

      - name: Rename and Upload Windows static lib (.lib)
        run: |
          copy build\lib\Release\Geruest.lib build\Geruest-msvc.lib

      - name: Upload Windows static lib (.lib)
        uses: softprops/action-gh-release@v2
        with:
          files: build/Geruest-msvc.lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
