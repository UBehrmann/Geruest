name: Build static libraries

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install libwebp
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release

      - name: Build Unit Tests
        run: |
          cd src/unitTests
          mkdir -p build && cd build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run Unit Tests
        run: |
          cd src/unitTests/build
          ./JSONParser_Tests
          ./HTTPRequest_Tests
          ./HTTPResponse_Tests
          ./FileManagement_Tests
          ./ContentBuilder_Tests

  build-windows-mingw:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-libwebp

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release

      - name: Build Unit Tests
        shell: msys2 {0}
        run: |
          cd src/unitTests
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run Unit Tests
        shell: msys2 {0}
        run: |
          cd src/unitTests/build
          ./JSONParser_Tests.exe
          ./HTTPRequest_Tests.exe
          ./HTTPResponse_Tests.exe
          ./FileManagement_Tests.exe
          ./ContentBuilder_Tests.exe

  build-windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libwebp via vcpkg
        run: |
          vcpkg install libwebp:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure and Build (.lib)
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_GENERATOR_PLATFORM=x64 -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build . --config Release

      - name: Build Unit Tests
        run: |
          cd src/unitTests
          mkdir build
          cd build
          cmake .. -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Run Unit Tests
        run: |
          cd src/unitTests/build/Release
          ./JSONParser_Tests.exe
          ./HTTPRequest_Tests.exe
          ./HTTPResponse_Tests.exe
          ./FileManagement_Tests.exe
          ./ContentBuilder_Tests.exe
