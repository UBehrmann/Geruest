name: Bump patch version

# Bumps the patch version in CMakeLists.txt after every push, unless the push
# itself changed the version (e.g. 0.15.1 -> 0.16.0 or 1.0.0).

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          re='s/^project\(GeruestLibrary VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p'
          # New branch or force push: no previous commit to compare against.
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          old=$(git show "$BEFORE:CMakeLists.txt" | sed -nE "$re")
          cur=$(sed -nE "$re" CMakeLists.txt)
          [ -n "$cur" ] && [ "$old" = "$cur" ] || { echo "Version changed in this push ($old -> $cur), not bumping"; exit 0; }
          IFS=. read -r major minor patch <<< "$cur"
          new="$major.$minor.$((patch + 1))"
          sed -i -E "s/^(project\(GeruestLibrary VERSION )$cur/\1$new/" CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $new"
          git push
