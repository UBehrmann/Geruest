<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat - Geruest</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .panel {
            width: 100%;
            max-width: 640px;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            padding: 16px 20px;
            background: #0f3460;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        header h1 { font-size: 1.1rem; flex: 1; }
        #status { font-size: 0.85rem; color: #94a3b8; }
        #log {
            flex: 1;
            min-height: 320px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 16px 20px;
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        footer {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            border-top: 1px solid #0f3460;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 1rem;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint {
            padding: 0 20px 12px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="panel">
        <header>
            <h1>Geruest Chat</h1>
            <span id="status">disconnected</span>
            <button type="button" id="connectBtn">Connect</button>
        </header>
        <div id="log"></div>
        <p class="hint">Tip: send <code>/nick YourName</code> to rename. Open multiple tabs to test broadcast.</p>
        <footer>
            <input type="text" id="name" placeholder="Display name" maxlength="32" />
            <input type="text" id="message" placeholder="Message…" disabled />
            <button type="button" id="sendBtn" disabled>Send</button>
        </footer>
    </div>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const nameEl = document.getElementById('name');
        const msgEl = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const connectBtn = document.getElementById('connectBtn');

        let ws = null;

        function appendLine(text) {
            logEl.textContent += text;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setConnected(on) {
            statusEl.textContent = on ? 'connected' : 'disconnected';
            msgEl.disabled = !on;
            sendBtn.disabled = !on;
            connectBtn.textContent = on ? 'Disconnect' : 'Connect';
            nameEl.disabled = on;
        }

        function chatUrl() {
            const name = encodeURIComponent(nameEl.value.trim() || 'guest');
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${proto}//${location.host}/chat?name=${name}`;
        }

        function connect() {
            if (ws) {
                ws.close();
                return;
            }
            ws = new WebSocket(chatUrl());
            ws.onopen = () => setConnected(true);
            ws.onclose = () => {
                setConnected(false);
                ws = null;
                appendLine('[system] disconnected\n');
            };
            ws.onerror = () => appendLine('[system] connection error\n');
            ws.onmessage = (e) => appendLine(e.data);
        }

        function send() {
            const text = msgEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(text);
            msgEl.value = '';
        }

        connectBtn.addEventListener('click', connect);
        sendBtn.addEventListener('click', send);
        msgEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });
        nameEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !ws) connect();
        });
    </script>
</body>
</html>
