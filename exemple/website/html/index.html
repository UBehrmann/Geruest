<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Page</title>
</head>
<body>
    <h1>Welcome to My Simple Website</h1>
    <p>This is a basic HTML page with some example content.</p>
    <p>You can add more content here as needed.</p>

    <h2>API Test Buttons</h2>
    <button id="getBtn">GET</button>
    <button id="postBtn">POST</button>
    <button id="putBtn">PUT</button>
    <button id="deleteBtn">DELETE</button>
    <br><br>
    <textarea id="requestBody" rows="3" cols="40" placeholder="Request body for POST/PUT (optional)"></textarea>
    <br>
    <div id="result" style="margin-top:20px; border:1px solid #ccc; padding:10px; min-height:40px; background:#f9f9f9;"></div>

    <script src="index.js"></script>
</body>
</html>
